name: VeCI XL compact MIPS physical one-shot gate
on:
  push:
    paths:
      - 'scripts/veci-xl-compact-runtime-physical-20261015.sh'
      - '.github/workflows/veci-xl-compact-physical-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify physical script does not touch modem, credentials or flash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          sh -n scripts/veci-xl-compact-runtime-physical-20261015.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/veci-xl-compact-runtime-physical-20261015.sh').read_text()
          for x in ("AT+CMGR", "AT+CUSD", "AT+CMGS", "/etc/init.d/",
                    "sysupgrade", "apk add", "otp ", "quota-http quota",
                    "veci-xl-http quota", "/overlay", "reboot", "Authorization:"):
              assert x not in s,x
          for good in ("--invalid-no-network", "VECI_REAL_OPERATOR_LOGIN=not_attempted",
                       "VECI_OPERATOR_QUOTA=not_verified",
                       "VECI_FLASH_WRITES=none", "/tmp/veci-xl-compact."):
              assert good in s,good
          print('VECI_XL_COMPACT_PHYSICAL_READONLY_GATE_PASS')
          PY
          mkdir -p /tmp/veci-download
          tag=veci-xl-runtime-compact-4773e7ca0628
          gh release download "$tag" -p 'veci-xl-crypto-dynamic-mipsel' -p 'veci-xl-quota-normalize-dynamic-mipsel' -p 'veci-xl-quota-http-dynamic-mipsel' -D /tmp/veci-download
          echo "4bb8f2cb62d18aa7da34bf84aba25a2681cc0dc1ef75d5d984dd0fd68b44d931  /tmp/veci-download/veci-xl-crypto-dynamic-mipsel" | sha256sum -c -
          echo "756daba7b1db1dbede615cf6154ed1ca767e66f42118aee947b515a9cdee1015  /tmp/veci-download/veci-xl-quota-normalize-dynamic-mipsel" | sha256sum -c -
          echo "eae118cb412eb173789837e683f51a43c64e9fb07faf0c02c78e46448d742a7e  /tmp/veci-download/veci-xl-quota-http-dynamic-mipsel" | sha256sum -c -
          echo VECI_XL_COMPACT_RELEASE_INTEGRITY_PASS
