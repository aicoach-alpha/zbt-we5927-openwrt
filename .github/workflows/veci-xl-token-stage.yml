name: VeCI XL CIAM token staging focused
on:
  push:
    paths:
      - 'source/veci-telco-indonesia/files/usr/libexec/veci-xl-token-stage'
      - 'tests/test_veci_xl_token_stage.py'
      - 'source/veci-telco-xl-native/Makefile'
      - '.github/workflows/veci-xl-token-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Only test candidate to private pending-profile staging
        run: |
          set -eu
          sh -n source/veci-telco-indonesia/files/usr/libexec/veci-xl-token-stage
          sudo python3 tests/test_veci_xl_token_stage.py
          python3 - <<'PY'
          from pathlib import Path
          pkg=Path('source/veci-telco-xl-native/Makefile').read_text()
          required=[
            'PKG_VERSION:=0.3.1',
            '$(PKG_BUILD_DIR)/veci-xl-ciam',
            'veci-xl-token-stage',
            'veci-xl-ciam.c',
            '-lmbedtls -lmbedx509 -lmbedcrypto',
          ]
          for a in required:
            assert a in pkg,a
          assert 'preinst' not in pkg and 'postinst' not in pkg
          print('VECI_XL_OPTIONAL_PACKAGE_STAGING=pass')
          PY
