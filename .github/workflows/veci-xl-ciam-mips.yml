name: VeCI XL CIAM OTP MIPS prerelease (focused)
on:
  push:
    paths:
      - 'source/veci-telco-indonesia/veci-xl-ciam.c'
      - 'tests/veci_xl_ciam_focused.c'
      - '.github/workflows/veci-xl-ciam-mips.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing OTP host focused tests only
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd cmake libmbedtls-dev
          cc -std=c11 -Os -Wall -Wextra -Werror \
            -o /tmp/veci-ciam-host-tests tests/veci_xl_ciam_focused.c \
            -lmbedtls -lmbedx509 -lmbedcrypto
          /tmp/veci-ciam-host-tests
          echo VECI_XL_CIAM_HOST=pass
      - name: Fetch official SHA-pinned OpenWrt 25.12.5 RAMIPS toolchain
        run: |
          set -eu
          name=openwrt-toolchain-25.12.5-ramips-mt76x8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          curl -fL --retry 3 --max-time 240 -o /tmp/toolchain.tar.zst \
            "https://downloads.openwrt.org/releases/25.12.5/targets/ramips/mt76x8/$name"
          echo "5e03963e3b5e2c12f8c1519a07d56a74babcd6147e95c4d50948e50ae465d776  /tmp/toolchain.tar.zst" | sha256sum -c -
          mkdir -p /tmp/veci-toolchain
          tar -xf /tmp/toolchain.tar.zst -C /tmp/veci-toolchain
          curl -fL --retry 3 --max-time 150 -o /tmp/mbedtls.tar.bz2 \
            https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.6/mbedtls-3.6.6.tar.bz2
          echo "8fb65fae8dcae5840f793c0a334860a411f884cc537ea290ce1c52bb64ca007a  /tmp/mbedtls.tar.bz2" | sha256sum -c -
          mkdir -p /tmp/veci-mbed
          tar -xf /tmp/mbedtls.tar.bz2 -C /tmp/veci-mbed
      - name: Cross compile only CIAM OTP for physical RAMIPS mipsel
        run: |
          set -eu
          cc="$(find -L /tmp/veci-toolchain -type f -name '*gcc' -executable | grep '/bin/' | head -1)"
          test -n "$cc"
          src=/tmp/veci-mbed/mbedtls-3.6.6
          cmake -S "$src" -B /tmp/veci-mbed/build \
            -DCMAKE_C_COMPILER="$cc" \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DENABLE_PROGRAMS=OFF -DENABLE_TESTING=OFF \
            -DUSE_SHARED_MBEDTLS_LIBRARY=ON \
            -DUSE_STATIC_MBEDTLS_LIBRARY=OFF \
            -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections -Os"
          cmake --build /tmp/veci-mbed/build --target mbedtls mbedx509 mbedcrypto -j2
          mkdir -p release
          "$cc" -std=c11 -Os -s -ffunction-sections -fdata-sections \
            -Wall -Wextra -Werror -I"$src/include" \
            -o release/veci-xl-ciam-mipsel \
            source/veci-telco-indonesia/veci-xl-ciam.c \
            -L/tmp/veci-mbed/build/library \
            -Wl,-rpath-link,/tmp/veci-mbed/build/library \
            -Wl,--gc-sections -lmbedtls -lmbedx509 -lmbedcrypto
          readelf -h release/veci-xl-ciam-mipsel | grep -Eq 'Machine:[ ]*MIPS'
          readelf -h release/veci-xl-ciam-mipsel | grep -q "2's complement, little endian"
          readelf -d release/veci-xl-ciam-mipsel > /tmp/veci-ciam-abi.txt
          grep -q 'libmbedtls.so.21' /tmp/veci-ciam-abi.txt
          grep -q 'libmbedx509.so.7' /tmp/veci-ciam-abi.txt
          grep -q 'libmbedcrypto.so.16' /tmp/veci-ciam-abi.txt
          ! grep -Eq 'RPATH|RUNPATH' /tmp/veci-ciam-abi.txt
          test "$(stat -c %s release/veci-xl-ciam-mipsel)" -lt 120000
          sha256sum release/veci-xl-ciam-mipsel > release/SHA256SUMS
          echo VECI_XL_CIAM_MIPS_ABI=pass
      - uses: actions/upload-artifact@v4
        with:
          name: veci-xl-ciam-otp-mipsel
          path: release/
      - name: Publish staged executable; NO router install
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="veci-xl-ciam-otp-$(echo "$GITHUB_SHA" | cut -c1-12)"
          gh release create "$tag" release/veci-xl-ciam-mipsel release/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease \
            --title "VeCI XL native CIAM OTP MIPS candidate" \
            --notes "Focused host test, cross-compilation and exact OpenWrt 25.12.5 MIPS shared ABI passed. Artifact staged only: no router deployment, no real OTP request, no authenticated XL account and no quota reading. Requires a separate local secret-provisioning and account-validation release gate before use."
          echo VECI_XL_CIAM_MIPS_STAGED="$tag"
