name: VeCI XL ubus error diagnostic one-file deploy
on:
  push:
    paths:
      - 'scripts/veci-xl-ussd-ubus-error-update-20261015.sh'
      - '.github/workflows/veci-xl-ussd-ubus-error-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned JS, rollback and one-file-only change
        run: |
          set -eu
          sh -n scripts/veci-xl-ussd-ubus-error-update-20261015.sh
          node tests/test_veci_xl_ussd_transport_codes.cjs
          echo '342c54d8519aec3b24ab4c1e7ae5bc1bb18c744297520217da216b5db401701e  source/veci-telco-xl-native/files/www/veci/xl-ussd-guide.js' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          old=Path('scripts/veci-xl-ussd-browser-rpcdiag-update-20261015.sh').read_text()
          new=Path('scripts/veci-xl-ussd-ubus-error-update-20261015.sh').read_text()
          for a,b in [
           ('REV=a86e2193b8d229914b473740f49a3e8c8c001f3d','REV=746dcdf0a56daff99269a1afcd00f24e56189a45'),
           ('OLD_SHA=7c3141c0903e8af9b4c45f3faac794dd8bae8daa7029863a1a02821a41fd5e14','OLD_SHA=c60d80b33cd3f49e25ff36ca4801c3ba481244ef2f98bf3697ec19ead61e8d83'),
           ('NEW_SHA=c60d80b33cd3f49e25ff36ca4801c3ba481244ef2f98bf3697ec19ead61e8d83','NEW_SHA=342c54d8519aec3b24ab4c1e7ae5bc1bb18c744297520217da216b5db401701e'),
           ('BACKUP=/root/veci-xl-guide-rpcdiag-rollback-20261015.js','BACKUP=/root/veci-xl-ubuserror-rollback-20261015.js'),
           ('VECI_XL_BROWSER_RPC_DIAG','VECI_XL_UBUS_ERROR_DIAG'),
           ('VeCI-only XL USSD browser permission diagnosis','VeCI-only XL USSD error classification')
          ]:
            assert a in old
            old=old.replace(a,b)
          assert old==new,'Extra unintended installer changes'
          assert 'same "$FILE" "$OLD_SHA"' in new
          assert 'same "$FILE" "$NEW_SHA"' in new
          assert 'same "$BACKUP" "$OLD_SHA"' in new
          assert 'VECI_XL_UBUS_ERROR_DIAG_ROLLBACK=available' in new
          assert new.index('if [ "$MODE" = --verify ]') < new.index('cp "$FILE" "$BACKUP"')
          for forbidden in ('AT+CUSD','AT+CMGS', 'ubus call', 'ubus -S call',
                            'apk add', 'apk del','/etc/init.d','sysupgrade',
                            'uci commit','uci set','uci add','uci delete','/luci-static/'):
            assert forbidden not in new,forbidden
          print('VECI_XL_UBUS_ERROR_UPDATE_SCOPE=pass')
          print('VECI_XL_UBUS_ERROR_ROLLBACK=pass')
          PY
