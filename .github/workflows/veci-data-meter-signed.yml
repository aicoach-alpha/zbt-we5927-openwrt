name: VeCI data meter 0.1.0 signed OpenWrt APK
on:
  push:
    paths:
      - 'source/veci-data-meter/**'
      - 'tests/test_veci_data_meter.py'
      - '.github/workflows/veci-data-meter-signed.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify meter source and no fake carrier balances
        run: |
          set -eu
          sudo python3 -m unittest discover -s tests -p 'test_veci_data_meter.py' -v
          sh -n source/veci-data-meter/files/usr/libexec/rpcd/veci.meter
          node --check source/veci-data-meter/files/www/veci/data-meter.js
      - name: Get SHA-pinned OpenWrt 25.12.5 MIPS SDK
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd make gcc g++ gawk flex bison gettext libncurses-dev libssl-dev rsync unzip python3 file openssl
          curl -fL --retry 3 --max-time 360 -o /tmp/sdk.tar.zst https://downloads.openwrt.org/releases/25.12.5/targets/ramips/mt76x8/openwrt-sdk-25.12.5-ramips-mt76x8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          echo 'b44636e0a53f0d769cbce64edb9ca3831e1a9ecdc8c53a5caf128884be6c490e  /tmp/sdk.tar.zst' | sha256sum -c -
          mkdir /tmp/sdk
          tar -xf /tmp/sdk.tar.zst -C /tmp/sdk --strip-components=1
      - name: Build optional metering package, never Core or XL
        run: |
          set -eu
          cp -a source/veci-data-meter /tmp/sdk/package/
          cd /tmp/sdk
          printf '\nCONFIG_PACKAGE_veci-data-meter=m\n' >> .config
          make defconfig
          make package/veci-data-meter/compile -j2 V=s
          root="$(find build_dir -type d -path '*/.pkgdir/veci-data-meter' -print -quit)"
          test -n "$root"
          test -s "$root/usr/libexec/rpcd/veci.meter"
          test -s "$root/usr/share/rpcd/acl.d/veci-data-meter.json"
          test -s "$root/www/veci/data-meter.html"
          test -s "$root/www/veci/data-meter.js"
          test -z "$(find "$root" -iname '*luci*' -print -quit)"
          mkdir -p "$GITHUB_WORKSPACE/release"
          tool=/tmp/sdk/staging_dir/host/bin/apk
          "$tool" mkpkg --info 'name:veci-data-meter' --info 'version:0.1.0-r1' --info 'arch:mipsel_24kc' --info 'origin:veci-data-meter' --info 'description:VeCI uplink byte measurements, optional manual quota estimate' --info 'depends:jsonfilter rpcd' --files "$root" --output "$GITHUB_WORKSPACE/release/veci-data-meter-0.1.0-r1.apk"
          test -s "$GITHUB_WORKSPACE/release/veci-data-meter-0.1.0-r1.apk"
      - name: Sign and inspect the optional package
        run: |
          set -eu
          p=release/veci-data-meter-0.1.0-r1.apk
          tool=/tmp/sdk/staging_dir/host/bin/apk
          umask 077
          mkdir -p /tmp/sign/keys /tmp/sign/none
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/sign/private.pem
          openssl pkey -in /tmp/sign/private.pem -pubout -out /tmp/sign/keys/veci-data-meter-010.pem
          "$tool" --allow-untrusted adbsign --reset-signatures --sign-key /tmp/sign/private.pem "$p"
          "$tool" --keys-dir /tmp/sign/keys verify "$p"
          if "$tool" --keys-dir /tmp/sign/none verify "$p" >/dev/null 2>&1; then exit 1; fi
          "$tool" --keys-dir /tmp/sign/keys adbdump --format json "$p" > release/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.dumps(json.loads(Path('release/manifest.json').read_text())).lower()
          for name in ('veci-data-meter','veci.meter','data-meter.html','data-meter.js','veci-data-meter.json'):
            assert name in manifest,name
          assert '/luci-static/' not in manifest
          print('VECI_DATA_METER_010_SIGNED_CONTENT=pass')
          PY
          cp /tmp/sign/keys/veci-data-meter-010.pem release/
          chmod 644 release/veci-data-meter-010.pem
          sha256sum "$p" release/veci-data-meter-010.pem > release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: veci-data-meter-010-signed
          path: release/
      - name: Publish signed candidate without deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="veci-data-meter-010-$(echo "$GITHUB_SHA" | cut -c1-12)"
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease --title 'VeCI Data Meter 0.1.0 MIPS signed APK' --notes 'Optional data usage estimate only; not authentic carrier remaining balance. No LuCI, Core, XL, SMS or modem changes. Production installation pending.'
