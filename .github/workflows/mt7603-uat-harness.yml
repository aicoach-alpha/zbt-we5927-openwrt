name: MT7603 wired UAT harness safety
on:
  push:
    branches-ignore:
      - build/zbt-we2825-oem-veci-20261119
    paths:
      - 'scripts/uat/**'
      - 'scripts/veci_wifi_scan.py'
      - 'scripts/tests/test_mt7603_wired_snapshot.py'
      - 'scripts/tests/test_veci_office_readonly.py'
      - '.github/workflows/mt7603-uat-harness.yml'
  pull_request:
    paths:
      - 'scripts/uat/**'
      - 'scripts/veci_wifi_scan.py'
      - 'scripts/tests/test_mt7603_wired_snapshot.py'
      - 'scripts/tests/test_veci_office_readonly.py'
      - '.github/workflows/mt7603-uat-harness.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile scripts/uat/mt7603_wired_snapshot.py scripts/veci_wifi_scan.py
      - name: Validate independent SSID scan and read-only contract
        run: |
          python3 -m unittest discover -s scripts/tests -p test_mt7603_wired_snapshot.py -v
          python3 -m unittest discover -s scripts/tests -p test_veci_office_readonly.py -v

  windows-ps51-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse office UAT in Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/uat/veci-office-readonly.ps1').Path,
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            throw 'PowerShell parsing failed'
          }
          Write-Host 'VECI_OFFICE_UAT_POWERSHELL_SYNTAX=PASS'
