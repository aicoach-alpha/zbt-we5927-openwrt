name: VeCI core API offline inspection
on:
  push:
    paths:
      - '.github/workflows/veci-core-api-offline-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read only signed core release API and permissions
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          curl -fL --retry 3 --max-time 240 -o /tmp/sdk.tar.zst https://downloads.openwrt.org/releases/25.12.5/targets/ramips/mt76x8/openwrt-sdk-25.12.5-ramips-mt76x8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          echo 'b44636e0a53f0d769cbce64edb9ca3831e1a9ecdc8c53a5caf128884be6c490e  /tmp/sdk.tar.zst' | sha256sum -c -
          mkdir /tmp/sdk /tmp/core
          tar -xf /tmp/sdk.tar.zst -C /tmp/sdk --strip-components=1
          curl -fL --retry 3 --max-time 120 -o /tmp/core.apk https://github.com/aicoach-alpha/zbt-we5927-openwrt/releases/download/veci-physical-core-022-c76cb7f13f06/veci-0.2.2-r1.apk
          echo 'e06ad0b5f57f29630f20ff4bdaa06665261c09cbaef21a17a5a5504c092ff168  /tmp/core.apk' | sha256sum -c -
          apk=/tmp/sdk/staging_dir/host/bin/apk
          "$apk" --allow-untrusted extract --no-chown --destination /tmp/core /tmp/core.apk
          p=/tmp/core/www/veci/js/lib/api.js
          test -s "$p"
          echo '61f8c5ca16d23ea29281cd98a37bd16cf79d8610eaf762329863a714ce2090be  /tmp/core/www/veci/js/lib/api.js' | sha256sum -c -
          echo VECI_API_CORE_HASH=pass
          grep -nE 'async call|call\(|async login|validateSession|ubusStatus|timeout|status|sessionId' "$p" | head -70
          echo VECI_CORE_API_BEGIN
          sed -n '1,190p' "$p"
          echo VECI_CORE_API_END
