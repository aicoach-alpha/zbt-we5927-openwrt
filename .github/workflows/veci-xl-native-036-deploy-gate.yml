name: VeCI XL 0.3.6 signed production installer gate
on:
  push:
    paths:
      - 'scripts/veci-xl-native-036-signed-deploy-20261015.sh'
      - '.github/workflows/veci-xl-native-036-deploy-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Strict signed optional package and rollback code gate
        run: |
          set -eu
          f=scripts/veci-xl-native-036-signed-deploy-20261015.sh
          sh -n "$f"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/veci-xl-native-036-signed-deploy-20261015.sh').read_text()
          assert 'TAG=veci-xl-native-036-5cfa0e0d3860' in s
          assert 'APK_SHA=ca670e83b5dc454b8d0afd736846e55e578d8c0aad67ada5112b3273f2eee82c' in s
          assert 'KEY_SHA=2301eb6954b58d29bd9f76a1616a9182fc5efb04d70c29b7b6e2d4db83cfb48e' in s
          for x in ('--status','--verify','--install','--rollback',
                    'apk --keys-dir "$WORK/keys" verify',
                    'apk --no-network --keys-dir "$WORK/keys" --simulate add',
                    'apk --no-network --keys-dir "$WORK/keys" add',
                    'apk --no-network del veci-telco-xl-native',
                    'core_guard','target_guard','CORE_RPCD_SHA','CORE_CONFIG_SHA',
                    "grep -qx 'veci.xl'",'VECI_XL_036_LUCI_MODIFIED=false',
                    'VECI_XL_036_MODEM_SMS_UNCHANGED=true'):
              assert x in s,x
          for forbidden in ('sysupgrade','AT+CMGS','AT+CUSD',
                            '/etc/init.d/network restart','--allow-untrusted',
                            'apk upgrade','/luci-static/'):
              assert forbidden not in s,forbidden
          assert s.index('APPLIED=1') < s.index('apk --no-network --keys-dir "$WORK/keys" add')
          assert s.index('target_guard\ncore_guard') > s.index('apk --no-network --keys-dir "$WORK/keys" add')
          print('VECI_XL_036_DEPLOY_SOURCE=pass')
          PY
      - name: Verify immutable release asset checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir /tmp/veci-xl-036
          gh release download veci-xl-native-036-5cfa0e0d3860 \
            -p 'veci-telco-xl-native-0.3.6-r1.apk' \
            -p 'veci-xl-036.pem' -D /tmp/veci-xl-036
          echo 'ca670e83b5dc454b8d0afd736846e55e578d8c0aad67ada5112b3273f2eee82c  /tmp/veci-xl-036/veci-telco-xl-native-0.3.6-r1.apk' | sha256sum -c -
          echo '2301eb6954b58d29bd9f76a1616a9182fc5efb04d70c29b7b6e2d4db83cfb48e  /tmp/veci-xl-036/veci-xl-036.pem' | sha256sum -c -
          echo VECI_XL_036_DEPLOY_RELEASE_INTEGRITY=pass
