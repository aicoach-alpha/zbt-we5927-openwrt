name: VeCI WE5927 SMS Send MIPS release
on:
  push:
    paths:
      - 'source/we5927-lte/src/veci-sms-cmgs.c'
      - 'tests/test_veci_sms_cmgs_pty.py'
      - '.github/workflows/veci-sms-send-mips-release.yml'
permissions:
  contents: write
jobs:
  compile-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prove prompt, Ctrl-Z and reply parsing on simulated serial port
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_cmgs_pty.py' -v
      - name: Fetch OpenWrt 25.12.5 RAMIPS mt76x8 official cross-toolchain
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          filename=openwrt-toolchain-25.12.5-ramips-mt76x8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          curl -fL --retry 3 --max-time 240 -o /tmp/toolchain.tar.zst \
            "https://downloads.openwrt.org/releases/25.12.5/targets/ramips/mt76x8/$filename"
          echo "5e03963e3b5e2c12f8c1519a07d56a74babcd6147e95c4d50948e50ae465d776  /tmp/toolchain.tar.zst" | sha256sum -c -
          mkdir -p /tmp/owrt-mips
          tar -xf /tmp/toolchain.tar.zst -C /tmp/owrt-mips
      - name: Build stripped MIPS little-endian standalone binary
        run: |
          set -eu
          gcc="$(find /tmp/owrt-mips -type f -name '*gcc' -perm /111 | grep -E '/bin/.*gcc$' | head -1)"
          [ -n "$gcc" ]
          echo "Cross compiler: $(basename "$gcc")"
          mkdir -p release
          "$gcc" -static -std=c11 -Os -s -fno-ident -Wall -Wextra -Werror \
            -o release/veci-sms-cmgs-mipsel source/we5927-lte/src/veci-sms-cmgs.c
          file release/veci-sms-cmgs-mipsel
          readelf -h release/veci-sms-cmgs-mipsel | grep -Eq 'Machine:[ ]*MIPS'
          readelf -h release/veci-sms-cmgs-mipsel | grep -q "2's complement, little endian"
          if readelf -l release/veci-sms-cmgs-mipsel | grep -q INTERP;then exit 1;fi
          test "$(stat -c %s release/veci-sms-cmgs-mipsel)" -lt 350000
          sha256sum release/veci-sms-cmgs-mipsel | tee release/sha256sums
          echo SMS_MIPS_BIN_COMPILED_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: veci-sms-cmgs-mipsel
          path: release/
      - name: Publish pinned prerelease binary for router install (NOT deployed)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="veci-sms-cmgs-$(echo "$GITHUB_SHA" | cut -c1-12)"
          gh release create "$tag" release/veci-sms-cmgs-mipsel release/sha256sums \
            --target "$GITHUB_SHA" --prerelease \
            --title "VeCI WE5927 SMS CMGS candidate $(echo "$GITHUB_SHA" | cut -c1-12)" \
            --notes "OpenWrt 25.12.5 ramips mt76x8 native binary. Not installed on router. User-initiated sending only."
          echo "SMS_MIPS_PRERELEASE_CREATED=$tag"
