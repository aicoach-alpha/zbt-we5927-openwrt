name: VeCI Indonesia optional quota contract
on:
  workflow_dispatch:
  push:
    paths:
      - 'source/veci-telco-indonesia/**'
      - 'source/veci-telco-xl-native/**'
      - 'scripts/prepare-veci.sh'
      - 'scripts/select-veci-edition.sh'
      - 'tests/test_veci_indonesia_contract.py'
      - 'tests/test_veci_quota_cache.py'
      - 'tests/test_veci_indonesia_quota_ui.cjs'
      - 'docs/VECI-INDONESIA-EDITION.md'
      - '.github/workflows/veci-indonesia-contract.yml'
permissions:
  contents: read
concurrency:
  group: veci-indonesia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify read-only ubus provider and unavailable quota semantics
        run: python3 -m unittest discover -s tests -p 'test_veci_indonesia_contract.py' -v
      - name: Test local quota cache and negative fixtures
        run: python3 -m unittest discover -s tests -p 'test_veci_quota_cache.py' -v
      - name: Validate read-only LuCI quota view and ACL contract
        run: |
          node --check source/veci-telco-indonesia/files/www/luci-static/resources/view/veci/quota.js
          node tests/test_veci_indonesia_quota_ui.cjs
      - name: Stage General and Indonesia from same pinned source revision
        shell: bash
        run: |
          set -euo pipefail
          for edition in general indonesia; do
            workspace="$RUNNER_TEMP/veci-edition-$edition"
            mkdir -p "$workspace/package"
            VECI_EDITION="$edition" ./scripts/prepare-veci.sh "$workspace"
            printf 'CONFIG_PACKAGE_veci=y\\n' > "$workspace/.config"
            sh scripts/select-veci-edition.sh "$edition" "$workspace/.config"
            python3 - "$workspace" "$edition" <<'PY'
          import json, pathlib, sys
          root,edition=pathlib.Path(sys.argv[1]),sys.argv[2]
          release=json.loads((root/'package/veci-default-ui/files/etc/veci-release.json').read_text())
          assert release['edition']==edition
          pkg=root/'package/veci-telco-indonesia'
          native=root/'package/veci-telco-xl-native'
          cfg=(root/'.config').read_text()
          if edition=='general':
              assert not pkg.exists()
              assert not native.exists()
              assert 'CONFIG_PACKAGE_veci-telco-indonesia=y' not in cfg
          else:
              assert (pkg/'Makefile').exists()
              assert (pkg/'files/usr/libexec/rpcd/veci.quota').exists()
              assert (pkg/'files/usr/share/luci/menu.d/luci-app-veci-quota.json').exists()
              assert (pkg/'files/www/luci-static/resources/view/veci/quota.js').exists()
              assert (native/'Makefile').exists()
              assert 'CONFIG_PACKAGE_veci-telco-indonesia=y' in cfg
          assert '# CONFIG_PACKAGE_veci-telco-xl-native is not set' in cfg
          assert 'CONFIG_PACKAGE_veci-telco-xl-native=y' not in cfg
          print('Profile staged:',edition,'Pinned core:',release['veci_commit'][:12])
          PY
          done
      - name: Fail closed until authorized XL connector is implemented
        run: |
          test "$(sh source/veci-telco-indonesia/files/usr/libexec/veci-quota-cache status "$RUNNER_TEMP/no-quota-file.json" | python3 -c 'import json,sys; x=json.load(sys.stdin); print(x["state"])')" = not_connected
          echo 'Provider skeleton only; NO quota available; General build unchanged; no live router contacted.'
