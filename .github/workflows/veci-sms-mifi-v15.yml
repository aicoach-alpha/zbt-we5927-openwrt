name: VeCI MiFi SMS v1.5 release gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/veci-sms-mifi-v15-staged/**'
      - '.github/workflows/veci-sms-mifi-v15.yml'
      - 'scripts/veci-sms-mifi-v15-install.sh'
      - 'scripts/veci-sms-mifi-v15-decoder-hotfix.sh'
      - 'scripts/veci-sms-mifi-v153-staged/**'
      - 'scripts/veci-sms-mifi-v153-delete-install.sh'
      - 'scripts/veci-sms-mifi-v1531-inbox-hotfix.sh'
      - 'scripts/veci-sms-mifi-v154-ui-install.sh'
      - 'scripts/veci-sms-mifi-v1541-delete-copy-hotfix.sh'
      - 'scripts/veci-sms-mifi-v155-staged/**'
      - 'tests/veci_sms_mifi_decoder_smoke.cjs'
      - 'tests/veci_sms_mifi_send_smoke.cjs'
      - 'tests/test_veci_sms_delete_awk_smoke.py'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Backend, page, ACL and rollback script syntax
        shell: bash
        run: |
          set -eu
          sh -n scripts/veci-sms-mifi-v15-staged/rpcd-veci.sms
          sh -n scripts/veci-sms-mifi-v15-staged/veci-sms-mifi-inbox
          sh -n scripts/veci-sms-mifi-v153-staged/veci-sms-delete-one
          sh -n scripts/veci-sms-mifi-v155-staged/veci-sms-send-one
          sh -n scripts/veci-sms-mifi-v1531-inbox-hotfix.sh
          sh -n scripts/veci-sms-mifi-v154-ui-install.sh
          sh -n scripts/veci-sms-mifi-v1541-delete-copy-hotfix.sh
          if [ -f scripts/veci-sms-mifi-v153-delete-install.sh ]; then
            sh -n scripts/veci-sms-mifi-v153-delete-install.sh
          fi
          if [ -f scripts/veci-sms-mifi-v15-install.sh ]; then
            sh -n scripts/veci-sms-mifi-v15-install.sh
          fi
          node --check scripts/veci-sms-mifi-v15-staged/cellular.js
          python3 -m json.tool scripts/veci-sms-mifi-v15-staged/acl.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=Path('scripts/veci-sms-mifi-v15-staged')
          rpc=(d/'rpcd-veci.sms').read_text()
          worker=(d/'veci-sms-mifi-inbox').read_text()
          ui=(d/'cellular.js').read_text()
          acl=json.loads((d/'acl.json').read_text())
          assert acl['veci-sms-inbox-we5927']['read']['ubus']=={}
          assert acl['veci-sms-inbox-we5927']['write']['ubus']['veci.sms']==[
              'listIndex','getConfig','setEnabled','listMessages','deleteMessage','sendMessage']
          assert 'sms_state || { deny sms_disabled; return; }' in rpc
          assert 'sms_state || { unset result; deny sms_disabled; exit 0; }' in rpc
          assert 'smsState.textContent' in ui and 'clearSms()' in ui
          assert "api.call('veci.sms', 'listMessages'" in ui
          assert "api.call('veci.sms', 'setEnabled'" in ui
          assert "api.call('veci.sms.private'" not in ui
          assert 'on_demand_cmgl_pdu' in worker
          assert "flock -n -x 9" in worker
          assert 'pdu[count]=toupper($0)' in worker
          assert "'AT+CPMS?'" in worker
          assert 'delete_message()' in rpc
          assert 'send_message()' in rpc
          assert "api.call('veci.sms','sendMessage'" in ui
          # v1.5.3 adds storage before count; exact old v1.5.2 pattern
          # silently rejected ALL valid full-SMS lists after upgrade.
          assert all(('"storage":"'+v+'","count":') in rpc for v in ('SM','ME','MT'))

          delete=Path('scripts/veci-sms-mifi-v153-staged/veci-sms-delete-one').read_text()
          assert 'AT+CMGD=$slot,0' in delete
          assert '[ "$current" = "$expected" ] || fail' in delete
          assert 'SMS feature ON' not in delete or 'flock -n -x 9' in delete
          print('VECI_MIFI_SMS_V15_MINIMAL_RELEASE_GATE_PASS')
          PY
      - name: SMS Delete guarded AT response parser / no hardware
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_delete_awk_smoke.py' -v
      - name: Single-SMS Compose GSM7/UCS2 PDU smoke
        run: node tests/veci_sms_mifi_send_smoke.cjs
      - name: Operator sender and DCS PDU smoke
        run: node tests/veci_sms_mifi_decoder_smoke.cjs
      - name: Immutable deployment asset SHA256
        run: |
          echo VECI_MIFI_SMS_V15_SHA_BEGIN
          sha256sum scripts/veci-sms-mifi-v15-staged/rpcd-veci.sms \
                    scripts/veci-sms-mifi-v15-staged/veci-sms-mifi-inbox \
                    scripts/veci-sms-mifi-v15-staged/cellular.js \
                    scripts/veci-sms-mifi-v15-staged/acl.json \
                    scripts/veci-sms-mifi-v153-staged/veci-sms-delete-one
          echo VECI_MIFI_SMS_V15_SHA_END
