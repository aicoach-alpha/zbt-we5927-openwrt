name: VeCI v2 WE5927-DSIM laboratory full image (NEVER FLASH)

on:
  push:
    paths:
      - '.github/workflows/veci-v2-lab-image.yml'
  workflow_dispatch:
    inputs:
      export_unsigned_candidate:
        description: "Explicitly export verified UNSIGNED candidate to private artifact (NOT flash approved)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  full-laboratory-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenWrt host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang bison flex gawk gettext git gcc-multilib \
            libncurses-dev libssl-dev rsync subversion swig unzip wget \
            zlib1g-dev python3 python3-setuptools file xz-utils zstd

      - name: Pin, stage and verify exact 2SIM board sources
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openwrt-v2"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" fetch -q --depth=1 https://github.com/openwrt/openwrt.git 64900e756efa667774214f9c6b17c113222e01f7
          git -C "$root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$(cat source/openwrt-source-commit.txt)"
          grep -Fq 'LINUX_VERSION-6.12 = .112' "$root/target/linux/generic/kernel-6.12"
          git -C "$root" apply --check "$GITHUB_WORKSPACE/source/openwrt-zbt-we5927-current.patch"
          git -C "$root" apply "$GITHUB_WORKSPACE/source/openwrt-zbt-we5927-current.patch"
          sh scripts/stage-veci-reliability-rc.sh "$root"
          sh rebuild/veci-v2/ci/stage-v2-source.sh "$root"
          cp source/openwrt-we5927.config "$root/.config"
          cat >> "$root/.config" <<'PKGS'
          CONFIG_PACKAGE_veci-v2-runtime=y
          CONFIG_PACKAGE_veci-v2-package-manager=y
          CONFIG_PACKAGE_veci-v2-sms=y
          CONFIG_PACKAGE_veci-v2-ipv6=y
          CONFIG_PACKAGE_veci-v2-ui=y
          CONFIG_PACKAGE_veci-wifi-guardian=y
          CONFIG_PACKAGE_we5927-lte=y
          CONFIG_PACKAGE_libustream-mbedtls=y
          CONFIG_PACKAGE_px5g-mbedtls=y
          PKGS
          echo 'EXACT_TWO_SIM_SOURCE_STAGED=PASS'
          echo 'NOT_SIGNED_NOT_FLASH_APPROVED=TRUE'

      - name: Compile minimal VeCI v2 complete image
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/openwrt-v2"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          for name in veci-v2-runtime veci-v2-package-manager veci-v2-sms veci-v2-ipv6 veci-v2-ui veci-wifi-guardian; do
            grep -Fxq "CONFIG_PACKAGE_$name=y" .config
          done
          ! grep -Eq '^CONFIG_(DEFAULT_luci|PACKAGE_luci([-A-Za-z0-9_]*)?|PACKAGE_rpcd-mod-luci)=y$' .config
          ! grep -Fxq 'CONFIG_PACKAGE_veci=y' .config
          ! grep -Fxq 'CONFIG_PACKAGE_veci-cellular-we5927=y' .config
          ! grep -Fxq 'CONFIG_PACKAGE_veci-data-meter=y' .config
          ! grep -Fxq 'CONFIG_PACKAGE_veci-app-guest=y' .config
          ! grep -Fxq 'CONFIG_PACKAGE_veci-app-voucher=y' .config
          make -j2 V=s tools/install
          make -j2 V=s toolchain/install
          make -j2 V=s
          echo 'COMPLETE_WE5927_DSIM_V2_UNVERIFIED_IMAGE_BUILT=PASS'

      - name: Exact image metadata, size, security and core contents gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/openwrt-v2"
          count="$(find bin/targets/ramips/mt76x8 -maxdepth 1 -name '*zbt*we5927*sysupgrade.bin' -type f | wc -l)"
          test "$count" -eq 1
          image="$(find bin/targets/ramips/mt76x8 -maxdepth 1 -name '*zbt*we5927*sysupgrade.bin' -type f -print -quit)"
          bytes="$(stat -c %s "$image")"
          max=7995392
          reserve=1048576
          test "$bytes" -gt 0
          test "$bytes" -le "$((max-reserve))" || {
            echo "SIZE_GATE_FAILED bytes=$bytes max=$max reserve=$reserve" >&2
            exit 1
          }
          fwtool="$PWD/staging_dir/host/bin/fwtool"
          test -x "$fwtool"
          "$fwtool" -i "$RUNNER_TEMP/veci-v2-image-meta.json" "$image"
          python3 - "$RUNNER_TEMP/veci-v2-image-meta.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert "zbtlink,zbt-we5927" in m.get("supported_devices",[])
          assert m.get("version",{}).get("target")=="ramips/mt76x8"
          assert m.get("version",{}).get("version")=="25.12.6"
          print("EXACT_BOARD_IMAGE_METADATA=PASS")
          PY
          # Check the exact filesystem passed to mksquashfs4, not an
          # unconstrained find across build_dir (which hid the missing path).
          rom="$PWD/build_dir/target-mipsel_24kc_musl/root-ramips"
          test -d "$rom" || { echo "IMAGE_ROOT_MISSING:$rom" >&2; exit 1; }
          if [ ! -s "$rom/usr/libexec/rpcd/veci.v2" ]; then
            echo "IMAGE_ROOT_MISSING_RPCD_V2:$rom/usr/libexec/rpcd/veci.v2" >&2
            for dir in "$rom/usr/libexec/rpcd" "$PWD/staging_dir/target-mipsel_24kc_musl/root-ramips/usr/libexec/rpcd"; do
              if [ -d "$dir" ]; then
                echo "DIAGNOSTIC_RPCD_DIR:$dir" >&2
                find "$dir" -maxdepth 1 -type f -printf '%f\\n' | sort >&2
              fi
            done
            exit 1
          fi
          echo 'EXACT_COMPILED_IMAGE_ROOT_RPCD_V2=PASS'
          for path in usr/libexec/rpcd/veci.v2 \
                      usr/libexec/rpcd/veci.v2.pkg \
                      usr/libexec/rpcd/veci.sms \
                      usr/libexec/rpcd/veci.v2.ipv6 \
                      usr/sbin/we5927-lte \
                      usr/sbin/veci-wifi-guardian \
                      usr/sbin/wpad \
                      usr/sbin/px5g \
                      www/veci2/index.html \
                      www/veci2/app.js \
                      www/veci2/sms-codec.js \
                      www/veci2/sms-center.js \
                      www/index.html; do
            test -s "$rom/$path" || { echo "MISSING:$path" >&2; exit 1; }
          done
          find "$rom/lib/modules" -type f -name 'mt7603e.ko' -size +0c -print -quit | grep -q mt7603e.ko
          for forbidden in www/cgi-bin/luci www/luci-static usr/share/luci usr/lib/lua/luci usr/libexec/rpcd/veci.meter; do
            test ! -e "$rom/$forbidden" || { echo "UNWANTED:$forbidden"; exit 1; }
          done
          grep -Fq '/veci2/' "$rom/www/index.html"
          sha256sum "$image"
          echo "LAB_IMAGE_BYTES=$bytes"
          echo "FIRMWARE_PARTITION_BYTES=$max"
          echo "RAW_IMAGE_HEADROOM_BYTES=$((max-bytes))"
          echo 'V2_CORE_COMPONENTS_PRESENT=PASS'
          echo 'PHYSICAL_AP_OR_LTE_UAT=NOT_RUN'
          echo 'SIGNATURE_TRUST=NOT_VERIFIED'
          echo 'FLASH_PERMISSION=NO'

      # Deliberately restricted to an explicitly requested, reviewed build
      # branch. No image leaves CI on ordinary pushes or PR runs.
      - name: Prepare verified unsigned VeCI v2 image for offline signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_unsigned_candidate == true && github.ref == 'refs/heads/build/veci-v2-we5927-2sim-rc-20261117' }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/openwrt-v2/bin/targets/ramips/mt76x8"
          mapfile -t images < <(find "$dir" -maxdepth 1 -type f -name '*zbt*we5927*sysupgrade.bin' -print)
          test "${#images[@]}" -eq 1
          image="${images[0]}"
          bytes="$(stat -c %s "$image")"
          test "$bytes" -gt 0 && test "$bytes" -le 6946816
          meta="$RUNNER_TEMP/v2-offline-verify.json"
          "$RUNNER_TEMP/openwrt-v2/staging_dir/host/bin/fwtool" -i "$meta" "$image"
          python3 - "$meta" "$GITHUB_SHA" <<'PYV2'
          import json, pathlib, sys
          meta = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert "zbtlink,zbt-we5927" in meta.get("supported_devices", [])
          assert meta.get("version", {}).get("version") == "25.12.6"
          assert meta.get("version", {}).get("target") == "ramips/mt76x8"
          assert len(sys.argv[2]) == 40
          print("V2_UNSIGNED_EXACT_BOARD_METADATA=PASS")
          PYV2
          out="$RUNNER_TEMP/veci-v2-candidate"
          mkdir -p "$out"
          cp "$image" "$out/openwrt-25.12.6-veci-v2-WE5927-2SIM-UNSIGNED.bin"
          cp "$meta" "$out/OPENWRT_METADATA.json"
          cp source/openwrt-source-commit.txt "$out/OPENWRT_PIN.txt"
          printf 'build_sha=%s\\n' "$GITHUB_SHA" > "$out/BUILD_PROVENANCE.txt"
          sha256sum "$out/openwrt-25.12.6-veci-v2-WE5927-2SIM-UNSIGNED.bin" > "$out/SHA256SUMS"
          printf '%s\\n' 'UNSIGNED LABORATORY IMAGE. DO NOT FLASH.' 'Hardware UAT, offline signing, router trust anchor, recovery validation still required.' > "$out/DO_NOT_FLASH.txt"

      - name: Upload explicit unsigned image for independent offline verification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_unsigned_candidate == true && github.ref == 'refs/heads/build/veci-v2-we5927-2sim-rc-20261117' }}
        uses: actions/upload-artifact@v4
        with:
          name: veci-v2-we5927-2sim-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/veci-v2-candidate/
          if-no-files-found: error
          retention-days: 14

      - name: Production flash prohibited even on green CI
        if: always()
        run: |
          echo 'V2 IS A LABORATORY SOURCE/IMAGE PROTOTYPE.'
          echo 'NO UNSIGNED IMAGE UPLOADED OR RELEASED.'
          echo 'PRODUCTION ROUTER NOT MODIFIED.'
          echo 'FULL LUCI/OEM PARITY AND 72h PHYSICAL UAT NOT COMPLETE.'
