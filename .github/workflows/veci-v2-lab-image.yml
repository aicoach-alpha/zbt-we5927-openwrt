name: VeCI v2 WE5927-DSIM laboratory full image (NEVER FLASH)

on:
  push:
    branches-ignore:
      - feat/veci-v2-native-gui-refresh-20261126
      - build/zbt-we2825-oem-veci-20261119
    paths:
      - '.github/workflows/veci-v2-lab-image.yml'
      - 'rebuild/veci-v2/packages/**'
      - 'rebuild/veci-v2/contracts/**'
      - 'rebuild/veci-v2/ci/source-completion-gate.py'
      - 'rebuild/veci-v2/ci/bug-regression-gate.py'
      - 'rebuild/veci-v2/ci/stage-v2-source.sh'
      - 'rebuild/veci-v2/trust/**'
      - 'source/veci-cellular-we5927/**'
      - 'source/openwrt-source-commit.txt'
      - 'source/openwrt-we5927.config'
      - 'source/openwrt-zbt-we5927-current.patch'
      - 'scripts/stage-veci-reliability-rc.sh'
      - 'source/we5927-lte/**'
      - 'source/veci-wifi-guardian/**'
  workflow_dispatch:
    inputs:
      export_unsigned_candidate:
        description: "Explicitly export verified UNSIGNED candidate to private artifact (NOT flash approved)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  full-laboratory-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PRE-COMPILE FAIL-CLOSED. No apt/dependency install and no OpenWrt image
      # build until every mandatory VeCI core feature has source+test evidence.
      - name: Block incomplete owner firmware builds before any compilation
        shell: bash
        run: |
          set -euo pipefail
          # The source-only gate is intentionally first. It neither fetches
          # nor compiles OpenWrt firmware and rejects incomplete modules.
          python3 rebuild/veci-v2/ci/source-completion-gate.py

      - name: Install OpenWrt host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang bison flex gawk gettext git gcc-multilib \
            libncurses-dev libssl-dev libjson-c-dev cmake pkg-config busybox \
            rsync subversion swig unzip wget \
            zlib1g-dev python3 python3-setuptools file xz-utils zstd squashfs-tools

      # Host-only test dependencies are compiled AFTER the 40/40 source gate.
      # These are native UCI/json tools, NOT firmware or flashable artifacts.
      - name: Provision pinned native UCI and libubox test environment
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/provision-native-uci-tests.sh "$RUNNER_TEMP/veci-host-test-tools"

      - name: Execute all native source tests before OpenWrt firmware build
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/veci-host-test-tools/native-test-env.sh"
          test -x "$VECI_HOST_UCI"
          test -x "$VECI_LIBUBOX_PREFIX/bin/jshn"
          # Check every referenced original commit, immutable remote tag and
          # source checksum; full git history alone does not fetch dangling
          # local commits absent from GitHub refs.
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/verify-provenance-refs.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py' -q
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py' -q
          echo SOURCE_NATIVE_REGRESSION_COMPLETE=PASS

      - name: Pin, stage and verify exact 2SIM board sources
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openwrt-v2"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" fetch -q --depth=1 https://github.com/openwrt/openwrt.git 64900e756efa667774214f9c6b17c113222e01f7
          git -C "$root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$(cat source/openwrt-source-commit.txt)"
          grep -Fq 'LINUX_VERSION-6.12 = .112' "$root/target/linux/generic/kernel-6.12"
          git -C "$root" apply --check "$GITHUB_WORKSPACE/source/openwrt-zbt-we5927-current.patch"
          git -C "$root" apply "$GITHUB_WORKSPACE/source/openwrt-zbt-we5927-current.patch"
          sh scripts/stage-veci-reliability-rc.sh "$root"
          sh rebuild/veci-v2/ci/stage-v2-source.sh "$root"
          # The legacy catalog prepares this exact source identity, but the
          # catalog itself is deliberately NOT bundled into VeCI v2 ROM.
          # Without this overlay, veci.v2.pkg cannot verify a build-specific
          # signed app feed even though its APK compiles successfully.
          release_src="$root/package/veci-app-catalog-we5927/files/etc/veci-release.json"
          release_dst="$root/files/etc/veci-release.json"
          test -s "$release_src" && test ! -L "$release_src"
          test ! -L "$release_dst"
          mkdir -p "$root/files/etc"
          cp "$release_src" "$release_dst"
          python3 - "$release_dst" "$GITHUB_SHA" <<'PYRELEASE'
          import json, pathlib, sys
          m=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert m["build_id"] == sys.argv[2]
          assert m["board"] == "zbtlink,zbt-we5927"
          assert m["target"] == "ramips/mt76x8"
          assert m["version"] == "25.12.6"
          assert m["image_signature"] == "not_verified"
          print("V2_BUILD_ID_MANIFEST_STAGED=PASS")
          PYRELEASE
          install -Dm644 rebuild/veci-v2/trust/1d8759d36251c36c "$root/files/etc/opkg/keys/1d8759d36251c36c"
          platform="$root/target/linux/ramips/mt76x8/base-files/lib/upgrade/platform.sh"
          grep -Fxq 'REQUIRE_IMAGE_METADATA=1' "$platform"
          sed -i '/^REQUIRE_IMAGE_METADATA=1$/a REQUIRE_IMAGE_SIGNATURE=1' "$platform"
          cp source/openwrt-we5927.config "$root/.config"
          cat >> "$root/.config" <<'PKGS'
          CONFIG_PACKAGE_veci-v2-runtime=y
          CONFIG_PACKAGE_veci-v2-package-manager=y
          CONFIG_PACKAGE_veci-v2-sms=y
          CONFIG_PACKAGE_veci-v2-ipv6=y
          CONFIG_PACKAGE_veci-v2-ui=y
          CONFIG_PACKAGE_veci-wifi-guardian=y
          CONFIG_PACKAGE_we5927-lte=y
          CONFIG_PACKAGE_libustream-mbedtls=y
          CONFIG_PACKAGE_ucert=y
          CONFIG_PACKAGE_px5g-mbedtls=y
          PKGS
          echo 'EXACT_TWO_SIM_SOURCE_STAGED=PASS'
          echo 'NOT_SIGNED_NOT_FLASH_APPROVED=TRUE'

      - name: Compile minimal VeCI v2 complete image
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/openwrt-v2"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          for name in veci-v2-runtime veci-v2-package-manager veci-v2-sms veci-v2-ipv6 veci-v2-ui veci-wifi-guardian; do
            grep -Fxq "CONFIG_PACKAGE_$name=y" .config
          done
          if grep -E '^CONFIG_(DEFAULT_luci|PACKAGE_(luci([-A-Za-z0-9_]*)?|rpcd-mod-luci|veci|veci-cellular-we5927|veci-data-meter|veci-app-guest|veci-app-voucher))=y$' .config; then
            echo 'Unexpected package enabled in minimal image' >&2
            exit 1
          fi
          make -j2 V=s tools/install
          make -j2 V=s toolchain/install
          make -j2 V=s
          echo 'COMPLETE_WE5927_DSIM_V2_UNVERIFIED_IMAGE_BUILT=PASS'

      - name: Exact image metadata, size, security and core contents gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/openwrt-v2"
          count="$(find bin/targets/ramips/mt76x8 -maxdepth 1 -name '*zbt*we5927*sysupgrade.bin' -type f | wc -l)"
          test "$count" -eq 1
          image="$(find bin/targets/ramips/mt76x8 -maxdepth 1 -name '*zbt*we5927*sysupgrade.bin' -type f -print -quit)"
          bytes="$(stat -c %s "$image")"
          max=7995392
          reserve=1048576
          test "$bytes" -gt 0
          test "$bytes" -le "$((max-reserve))" || {
            echo "SIZE_GATE_FAILED bytes=$bytes max=$max reserve=$reserve" >&2
            exit 1
          }
          fwtool="$PWD/staging_dir/host/bin/fwtool"
          test -x "$fwtool"
          "$fwtool" -i "$RUNNER_TEMP/veci-v2-image-meta.json" "$image"
          python3 - "$RUNNER_TEMP/veci-v2-image-meta.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert "zbtlink,zbt-we5927" in m.get("supported_devices",[])
          assert m.get("version",{}).get("target")=="ramips/mt76x8"
          assert m.get("version",{}).get("version")=="25.12.6"
          print("EXACT_BOARD_IMAGE_METADATA=PASS")
          PY
          # Prove the compiled package payload was installed into the
          # precise image root and is present in the image's real SquashFS.
          # A successful package compile or APK installation log alone is
          # insufficient; do not mask an absent runtime with a source overlay.
          python3 "$GITHUB_WORKSPACE/rebuild/veci-v2/ci/check-compiled-apks.py" bin/packages/mipsel_24kc/base
          compiled_rom="$PWD/build_dir/target-mipsel_24kc_musl/root-ramips"
          test -d "$compiled_rom" || { echo "IMAGE_ROOT_MISSING:$compiled_rom" >&2; exit 1; }
          if [ ! -s "$compiled_rom/usr/libexec/rpcd/veci.v2" ]; then
            echo "IMAGE_ROOT_MISSING_RPCD_V2:$compiled_rom/usr/libexec/rpcd/veci.v2" >&2
            for dir in "$compiled_rom/usr/libexec/rpcd" "$PWD/staging_dir/target-mipsel_24kc_musl/root-ramips/usr/libexec/rpcd"; do
              echo "DIAGNOSTIC_RPCD_DIR:$dir" >&2
              if [ -d "$dir" ]; then ls -la "$dir" >&2; else echo NOT_A_DIRECTORY >&2; fi
            done
            echo "DIAGNOSTIC_PACKAGE_PAYLOAD:" >&2
            ls -la "$PWD/build_dir/target-mipsel_24kc_musl/veci-v2-runtime-0.1/ipkg-mipsel_24kc/veci-v2-runtime/usr/libexec/rpcd/" >&2 || true
            echo "DIAGNOSTIC_INSTALLED_MANIFEST:" >&2
            ls -la "$compiled_rom/lib/apk/db/" >&2 || true
            exit 1
          fi
          echo 'EXACT_COMPILED_IMAGE_ROOT_RPCD_V2=PASS'
          squash="$PWD/build_dir/target-mipsel_24kc_musl/linux-ramips_mt76x8/root.squashfs"
          kernel="$PWD/build_dir/target-mipsel_24kc_musl/linux-ramips_mt76x8/zbtlink_zbt-we5927-kernel.bin"
          test -s "$squash" && test -s "$kernel" || {
            echo 'MISSING_FINAL_KERNEL_OR_SQUASHFS' >&2; exit 1;
          }
          kernel_bytes="$(stat -c %s "$kernel")"
          squash_bytes="$(stat -c %s "$squash")"
          cmp -s -n "$squash_bytes" -i "$kernel_bytes:0" "$image" "$squash" || {
            echo 'IMAGE_EMBEDDED_SQUASHFS_MISMATCH' >&2; exit 1;
          }
          rom="$RUNNER_TEMP/veci-v2-verified-squashfs"
          mkdir -p "$rom"
          # SquashFS contains /dev/console character device. A non-root extraction
          # returns exit code 2 even when regular files are extracted.
          # Extract as root so device-node errors remain a hard gate.
          sudo unsquashfs -no-progress -d "$rom" "$squash"
          # Verify all 39 active modules' exact reviewed source payloads
          # in the FINAL extracted image, not merely package metadata.
          python3 "$GITHUB_WORKSPACE/rebuild/veci-v2/ci/check-all-core-rom.py" "$rom" "$RUNNER_TEMP/ROM_PAYLOADS.json"
          test -s "$rom/usr/libexec/rpcd/veci.v2" || {
            echo 'FINAL_SQUASHFS_MISSING_RPCD_V2' >&2; exit 1;
          }
          cmp -s "$compiled_rom/usr/libexec/rpcd/veci.v2" "$rom/usr/libexec/rpcd/veci.v2" || {
            echo 'FINAL_SQUASHFS_RPCD_V2_DIFFERENT_FROM_BUILD_ROOT' >&2; exit 1;
          }
          echo 'EXACT_EMBEDDED_SQUASHFS_AND_RPCD_V2=PASS'
          python3 - "$rom/etc/veci-release.json" "$GITHUB_SHA" <<'PYRELEASE'
          import json, pathlib, sys
          path=pathlib.Path(sys.argv[1])
          assert path.is_file() and path.stat().st_size > 0
          m=json.loads(path.read_text())
          assert m["build_id"] == sys.argv[2]
          assert m["board"] == "zbtlink,zbt-we5927"
          assert m["target"] == "ramips/mt76x8"
          assert m["version"] == "25.12.6"
          assert m["image_signature"] == "not_verified"
          print("V2_EXTRACTED_RELEASE_MANIFEST=PASS")
          PYRELEASE
          for path in usr/libexec/rpcd/veci.v2 \
                      usr/libexec/rpcd/veci.v2.pkg \
                      usr/libexec/rpcd/veci.sms \
                      usr/libexec/rpcd/veci.v2.ipv6 \
                      usr/sbin/we5927-lte \
                      usr/sbin/veci-wifi-guardian \
                      usr/sbin/wpad \
                      usr/sbin/px5g \
                      www/veci2/index.html \
                      www/veci2/app.js \
                      www/veci2/sms-codec.js \
                      www/veci2/sms-center.js \
                      www/index.html; do
            test -s "$rom/$path" || { echo "MISSING:$path" >&2; exit 1; }
          done
          for module in mt7603e rndis_host usb_wwan option; do
            path=$(find "$rom/lib/modules" -type f -name "$module.ko" -size +0c -print -quit)
            test -n "$path" || { echo "MISSING_DRIVER:$module" >&2; exit 1; }
          done
          for helper in veci-sms-send-one veci-sms-delete-one; do
            test -x "$rom/usr/libexec/$helper"
            cmp "$GITHUB_WORKSPACE/source/veci-cellular-we5927/files/usr/libexec/$helper" "$rom/usr/libexec/$helper"
          done
          test -x "$rom/usr/libexec/veci-sms-cmgs"
          cmp "$compiled_rom/usr/libexec/veci-sms-cmgs" "$rom/usr/libexec/veci-sms-cmgs"
          test -x "$rom/usr/bin/curl"
          test -x "$rom/usr/sbin/we5927-lte"
          cmp "$GITHUB_WORKSPACE/source/we5927-lte/files/usr/sbin/we5927-lte" "$rom/usr/sbin/we5927-lte"
          test -x "$rom/usr/bin/ucert"
          runtime="$GITHUB_WORKSPACE/rebuild/veci-v2/packages/veci-v2-runtime"
          ui="$GITHUB_WORKSPACE/rebuild/veci-v2/packages/veci-v2-ui/files"
          cmp "$runtime/veci2-lte-policy" "$rom/usr/libexec/rpcd/veci.v2.lte"
          cmp "$runtime/veci2-status" "$rom/usr/libexec/rpcd/veci.v2"
          cmp "$runtime/veci2-status-acl.json" "$rom/usr/share/rpcd/acl.d/veci-v2-runtime.json"
          for rel in www/veci2/app.js www/veci2/index.html www/veci2/app.css etc/uci-defaults/97-veci-v2-https; do
            cmp "$ui/$rel" "$rom/$rel"
          done
          test -x "$rom/etc/uci-defaults/97-veci-v2-https"
          test -x "$rom/usr/libexec/rpcd/veci.v2.lte"
          test -x "$rom/usr/libexec/rpcd/veci.v2.wifi"
          cmp "$GITHUB_WORKSPACE/rebuild/veci-v2/packages/veci-v2-runtime/veci2-wifi" "$rom/usr/libexec/rpcd/veci.v2.wifi"
          test -x "$rom/www/cgi-bin/veci2-verify"
          test -x "$rom/usr/libexec/veci2-verify-image"
          cmp "$GITHUB_WORKSPACE/rebuild/veci-v2/packages/veci-v2-ui/files/www/cgi-bin/veci2-verify" "$rom/www/cgi-bin/veci2-verify"
          cmp "$GITHUB_WORKSPACE/rebuild/veci-v2/packages/veci-v2-runtime/veci2-verify-image" "$rom/usr/libexec/veci2-verify-image"
          grep -Fxq 'REQUIRE_IMAGE_SIGNATURE=1' "$rom/lib/upgrade/platform.sh"
          cmp "$GITHUB_WORKSPACE/rebuild/veci-v2/trust/1d8759d36251c36c" "$rom/etc/opkg/keys/1d8759d36251c36c"
          for module in mt7603e rndis_host option; do
            test -s "$rom/lib/modules/6.12.112/$module.ko"
          done
          for forbidden in www/cgi-bin/luci www/luci-static usr/share/luci usr/lib/lua/luci usr/libexec/rpcd/veci.meter usr/libexec/rpcd/veci.v2.ussd www/veci2/ussd.js; do
            test ! -e "$rom/$forbidden" || { echo "UNWANTED:$forbidden"; exit 1; }
          done
          ! grep -Fiq 'ussd' "$rom/www/veci2/index.html" || { echo 'RETIRED_USSD_UI_RESURRECTED' >&2; exit 1; }
          ! grep -Fiq 'veci.v2.ussd' "$rom/usr/share/rpcd/acl.d/veci-v2-runtime.json" || { echo 'RETIRED_USSD_ACL_RESURRECTED' >&2; exit 1; }
          grep -Fq '/veci2/' "$rom/www/index.html"
          sha256sum "$image"
          echo "LAB_IMAGE_BYTES=$bytes"
          echo "FIRMWARE_PARTITION_BYTES=$max"
          echo "RAW_IMAGE_HEADROOM_BYTES=$((max-bytes))"
          echo 'V2_CORE_COMPONENTS_PRESENT=PASS'
          echo 'PHYSICAL_AP_OR_LTE_UAT=NOT_RUN'
          echo 'SIGNATURE_TRUST=NOT_VERIFIED'
          echo 'FLASH_PERMISSION=NO'

      # Deliberately restricted to an explicitly requested, reviewed build
      # branch. Only manual explicit export or a marked build commit exports; ordinary pushes/PR runs cannot.
      - name: Prepare verified unsigned VeCI v2 image for offline signing
        id: prepare_candidate
        if: ${{ (github.ref == 'refs/heads/feat/we5927-39module-reconcile-20261124' && github.event_name == 'workflow_dispatch' && inputs.export_unsigned_candidate == true) || (github.ref == 'refs/heads/development/we2825-all13-integration-20261123' && github.event_name == 'workflow_dispatch' && inputs.export_unsigned_candidate == true) || (((github.ref == 'refs/heads/build/veci-v2-we5927-2sim-rc-20261117' && ((github.event_name == 'workflow_dispatch' && inputs.export_unsigned_candidate == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[export-unsigned-veci-v2]')))) || (github.ref == 'refs/heads/build/zbt-we2825-oem-veci-20261119' && ((github.event_name == 'workflow_dispatch' && inputs.export_unsigned_candidate == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[export-unsigned-veci-v2]')))))) || (github.ref == 'refs/heads/feat/veci-v2-native-gui-refresh-20261126' && github.event_name == 'workflow_dispatch' && inputs.export_unsigned_candidate == true) }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/openwrt-v2/bin/targets/ramips/mt76x8"
          mapfile -t images < <(find "$dir" -maxdepth 1 -type f -name '*zbt*we5927*sysupgrade.bin' -print)
          test "${#images[@]}" -eq 1
          image="${images[0]}"
          bytes="$(stat -c %s "$image")"
          test "$bytes" -gt 0 && test "$bytes" -le 6946816
          meta="$RUNNER_TEMP/v2-offline-verify.json"
          "$RUNNER_TEMP/openwrt-v2/staging_dir/host/bin/fwtool" -i "$meta" "$image"
          python3 - "$meta" "$GITHUB_SHA" <<'PYV2'
          import json, pathlib, sys
          meta = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert "zbtlink,zbt-we5927" in meta.get("supported_devices", [])
          assert meta.get("version", {}).get("version") == "25.12.6"
          assert meta.get("version", {}).get("target") == "ramips/mt76x8"
          assert len(sys.argv[2]) == 40
          print("V2_UNSIGNED_EXACT_BOARD_METADATA=PASS")
          PYV2
          out="$RUNNER_TEMP/veci-v2-candidate"
          mkdir -p "$out"
          cp "$image" "$out/openwrt-25.12.6-veci-v2-WE5927-2SIM-UNSIGNED.bin"
          cp "$meta" "$out/OPENWRT_METADATA.json"
          cp "$RUNNER_TEMP/ROM_PAYLOADS.json" "$out/ROM_PAYLOADS.json"
          cp source/openwrt-source-commit.txt "$out/OPENWRT_PIN.txt"
          # Exported checksum paths must be portable and verifiable off-runner.
          # Keep all release evidence explicitly UNSIGNED; no signing keys in CI.
          printf 'build_sha=%s\n' "$GITHUB_SHA" > "$out/BUILD_PROVENANCE.txt"
          (
            cd "$out"
            sha256sum openwrt-25.12.6-veci-v2-WE5927-2SIM-UNSIGNED.bin > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          python3 - "$out" "$GITHUB_SHA" "$bytes" <<'PYREPORT'
          import hashlib
          import json
          import pathlib
          import sys

          out = pathlib.Path(sys.argv[1])
          build_sha = sys.argv[2]
          image_bytes = int(sys.argv[3])
          image_name = "openwrt-25.12.6-veci-v2-WE5927-2SIM-UNSIGNED.bin"
          image_path = out / image_name
          metadata = json.loads((out / "OPENWRT_METADATA.json").read_text())
          source_pin = (out / "OPENWRT_PIN.txt").read_text().strip()
          image_sha256 = hashlib.file_digest(image_path.open("rb"), "sha256").hexdigest()
          assert len(build_sha) == 40
          assert image_path.is_file() and image_path.stat().st_size == image_bytes
          assert 0 < image_bytes <= 7995392 - 1048576
          assert "zbtlink,zbt-we5927" in metadata.get("supported_devices", [])
          assert metadata.get("version", {}).get("target") == "ramips/mt76x8"
          assert metadata.get("version", {}).get("version") == "25.12.6"
          assert len(source_pin) == 40
          assert (out / "SHA256SUMS").read_text().strip() == f"{image_sha256}  {image_name}"
          report = {
              "schema": "veci-v2-unsigned-candidate.v1",
              "release_state": "UNSIGNED_LABORATORY_ONLY",
              "flash_allowed": False,
              "build_sha": build_sha,
              "openwrt_source_pin": source_pin,
              "board": "zbtlink,zbt-we5927",
              "target": "ramips/mt76x8",
              "openwrt_version": "25.12.6",
              "image_filename": image_name,
              "image_sha256": image_sha256,
              "rom_payload_manifest_sha256": hashlib.sha256((out / "ROM_PAYLOADS.json").read_bytes()).hexdigest(),
              "image_bytes": image_bytes,
              "firmware_partition_bytes": 7995392,
              "minimum_free_partition_reserve_bytes": 1048576,
              "remaining_partition_bytes": 7995392 - image_bytes,
              "ci_build_and_embedded_squashfs_gate": "pass",
              "ci_core_content_and_no_luci_gate": "pass",
              "signing_and_trust_anchor": "not_verified",
              "sysupgrade_hardware_test": "not_run",
              "physical_and_72h_uat": "not_run",
              "full_oem_luci_parity": "not_verified"
          }
          (out / "VERIFICATION_REPORT.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print("PORTABLE_UNSIGNED_CANDIDATE_EVIDENCE=PASS")
          PYREPORT
          printf '%s\n' 'UNSIGNED LABORATORY IMAGE. DO NOT FLASH.' 'Hardware UAT, offline signing, router trust anchor, recovery validation still required.' > "$out/DO_NOT_FLASH.txt"

      - name: Upload explicit unsigned image for independent offline verification
        if: ${{ steps.prepare_candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: veci-v2-we5927-2sim-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/veci-v2-candidate/
          if-no-files-found: error
          retention-days: 14

