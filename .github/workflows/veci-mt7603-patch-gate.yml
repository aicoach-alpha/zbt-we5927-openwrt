name: VeCI mt7603 deadlock patch gate

on:
  push:
    paths:
      - 'source/mt76-patches/**'
      - 'scripts/stage-mt7603-deadlock-fix.sh'
      - '.github/workflows/veci-mt7603-patch-gate.yml'
  pull_request:
    paths:
      - 'source/mt76-patches/**'
      - 'scripts/stage-mt7603-deadlock-fix.sh'
      - '.github/workflows/veci-mt7603-patch-gate.yml'

jobs:
  pinned-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging script syntax
        run: sh -n scripts/stage-mt7603-deadlock-fix.sh
      - name: Verify patch against exact OpenWrt 25.12.5 mt76 revision
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mt76"
          mkdir -p "$src"
          git -C "$src" init -q
          git -C "$src" fetch -q --depth=1 https://github.com/openwrt/mt76.git 39c960c3ada558b4c2e7915772483d3731573d09
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "39c960c3ada558b4c2e7915772483d3731573d09"
          grep -Fq 'mt7603_mac_work(&dev->mphy.mac_work.work);' "$src/mt7603/main.c"
          git -C "$src" apply --check "$GITHUB_WORKSPACE/source/mt76-patches/950-mt7603-defer-watchdog-on-channel-failure.patch"
          git -C "$src" apply "$GITHUB_WORKSPACE/source/mt76-patches/950-mt7603-defer-watchdog-on-channel-failure.patch"
          grep -Fq 'ieee80211_queue_delayed_work(mt76_hw(dev),' "$src/mt7603/main.c"
          echo 'EXACT_REVISION_APPLICABILITY=PASS'
      - name: Revision-guarded staging must be idempotent and fail closed
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openwrt"
          mkdir -p "$root/package/kernel/mt76"
          printf 'PKG_SOURCE_VERSION:=39c960c3ada558b4c2e7915772483d3731573d09\n' > "$root/package/kernel/mt76/Makefile"
          sh scripts/stage-mt7603-deadlock-fix.sh "$root"
          sh scripts/stage-mt7603-deadlock-fix.sh "$root"
          cmp source/mt76-patches/950-mt7603-defer-watchdog-on-channel-failure.patch "$root/package/kernel/mt76/patches/950-mt7603-defer-watchdog-on-channel-failure.patch"
          printf 'PKG_SOURCE_VERSION:=mismatched\n' > "$root/package/kernel/mt76/Makefile"
          if sh scripts/stage-mt7603-deadlock-fix.sh "$root"; then
            echo 'ERROR: script accepted unexpected source revision' >&2
            exit 1
          fi
          echo 'REVISION_GUARD=PASS'
