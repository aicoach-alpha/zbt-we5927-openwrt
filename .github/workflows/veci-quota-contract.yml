name: VeCI quota contract tests
# Retired carrier-quota integration (owner decision 2026-10-28).
# Preserve archival contract tests for deliberate manual use only.
# No automatic push/PR jobs or repeat CI spend.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run native VeCI quota contract tests
        run: node --test source/veci-quota/tests/*.test.cjs
