name: VeCI quota contract tests
on:
  push:
    paths:
      - 'source/veci-quota/**'
      - '.github/workflows/veci-quota-contract.yml'
  pull_request:
    paths:
      - 'source/veci-quota/**'
      - '.github/workflows/veci-quota-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run native VeCI quota contract tests
        run: node --test source/veci-quota/tests/*.test.cjs
