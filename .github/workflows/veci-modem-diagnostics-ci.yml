      - '.github/workflows/veci-modem-diagnostics-ci.yml'
      - 'docs/VECI-SMS-USSD-READINESS.md'
      - 'scripts/veci-live-capability-hotfix.sh'
      - 'scripts/veci-live-minimal/**'
      - 'tests/test_veci_live_capability_hotfix.py'
      - 'scripts/veci-live-storage-v2/**'
      - 'scripts/veci-live-storage-hotfix-v2.sh'
      - 'tests/test_veci_live_storage_hotfix_v2.py'

permissions:
  contents: read

concurrency:
  group: veci-modem-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Offline AT parser, mocked serial replies, lock and ACL tests
        run: python3 -m unittest discover -s tests -p 'test_veci_modem_sms_ussd.py' -v
      - name: Verify read-only SMS storage counter, mocked modem, corruption and concurrent lock
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_storage_readonly.py' -v
      - name: "Audit minimal reversible overlay hotfix: pinned SHA256, ACL and legacy RPC ABI"
        run: python3 -m unittest discover -s tests -p 'test_veci_live_capability_hotfix.py' -v
      - name: Verify reversible v2 SMS storage overlay package and retained v1 rollback
        run: python3 -m unittest discover -s tests -p 'test_veci_live_storage_hotfix_v2.py' -v
      - name: Compile and exercise native AT serial transport against fake pseudo-terminal
        run: python3 -m unittest discover -s tests -p 'test_we5927_at_transport.py' -v
      - name: Compile and test inert PDU-mode SMS and deferred USSD parser
        run: python3 -m unittest discover -s tests -p 'test_veci_at_framing.py' -v
      - name: Verify full-session native AT lock against flock and bounded contention
        run: python3 -m unittest discover -s tests -p 'test_veci_modem_session_lock.py' -v
      - name: Test inactive bounded and consent-gated SMS/USSD FIFO
        run: python3 -m unittest discover -s tests -p 'test_veci_modem_job_queue.py' -v
      - name: Cross-check fragmented AT responses against SMS/USSD FIFO state machine
        run: python3 -m unittest discover -s tests -p 'test_veci_modem_pipeline.py' -v
      - name: Compile and test AT session coordinator, epochs, stale URCs, held descriptor (offline)
        run: python3 -m unittest discover -s tests -p 'test_veci_modem_transaction.py' -v
      - name: Exercise compile-gated full-session AT transport against isolated mock PTYs
        run: python3 -m unittest discover -s tests -p 'test_veci_serial_pty_smoke.py' -v
      - name: Verify read-only modem identity policy using isolated fake sysfs and PTY
        run: python3 -m unittest discover -s tests -p 'test_veci_modem_identity.py' -v
      - name: Verify explicit-only CMGL PDU inbox indexing without SMS text or sender disclosure
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_inbox_index.py' -v
      - name: Compile offline-only single CMGR host PTY verified-FD transport and exercise no-retry policy
        run: python3 -m unittest discover -s tests -p 'test_veci_serial_cmgr_pty_guard.py' -v
      - name: Verify strict SMS CMGR response and delayed private PDU decode with host-only fixtures
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_cmgr_frame.py' -v
      - name: Guard automatic OTP to independently verified official telco quota login only
        run: python3 -m unittest discover -s tests -p 'test_veci_telco_quota_otp_policy.py' -v
      - name: Verify server-trusted one-use SMS capability binding, TTL, consumed-before-I/O and zeroization
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_read_capability.py' -v
      - name: Validate locked one-use SMS capability across separate rpcd processes (offline only)
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_read_cap_store.py' -v
      - name: Validate source-only rpcd ucode request context against mock ACL sessions
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_auth_ubus_preflight.py' -v
      - name: Validate no-install read-only ucode/uhttpd backend readiness probe
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_auth_backend_readonly.py' -v
      - name: Verify corrected UCI no_ubusauth and effective runtime flags without secrets
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_auth_effective_readonly.py' -v
      - name: Validate one-process SMS private consent, restricted ACL, replay prevention (no modem)
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_private_consent.py' -v
      - name: Verify one-shot SMS read-slot authorization, CSRF, consent, replay and modem generation guard (source only)
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_read_slot_policy.py' -v
      - name: Verify bounded 3GPP SMS PDU GSM7 UCS2 and UDH multipart decoding (offline)
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_pdu_decode.py' -v
      - name: Print SHA256 for exact live v1.2 UI, staged v1.3 UI and optional RPC assets
        run: |
          sha256sum scripts/veci-sms-inbox-ui-staged-20261013/cellular.js
          sha256sum source/veci-sms-inbox-we5927/files/usr/libexec/rpcd/veci.sms
          sha256sum source/veci-sms-inbox-we5927/files/usr/libexec/veci-sms-inbox-index
          sha256sum source/veci-sms-inbox-we5927/files/usr/share/rpcd/acl.d/veci-sms-inbox-we5927.json
      - name: Verify read-only SMS Inbox ACL grants and anonymous session audit with no credentials
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_acl_session_audit.py' -v
      - name: Verify on-device rpcd list-signature preflight never calls the modem or restarts services
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_rpcd_preflight_readonly.py' -v
      - name: Simulate v1.3.1 bounded rpcd readiness, delayed registration and verified rollback
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_inbox_installer_v131.py' -v
      - name: Simulate safe v1.3 exact-live UI and independent rpcd package install/rollback
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_inbox_installer_v13.py' -v
      - name: Verify isolated admin-write SMS inbox RPC, explicit consent and rate limit
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_rpc_admin_consent.py' -v
      - name: Verify exact-v1.2 SMS inbox UI delta, two-step confirmation and no auto CMGL
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_inbox_ui_stage.py' -v
      - name: Simulate captured-hash v1.2 UI overlay installation, fail closed and rollback
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_ui_hotfix_v12.py' -v
      - name: Prove physical WE5927 Cellular exact-upload hash and surgical SMS storage delta
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_ui_exact_live_20261012.py' -v
      - name: Verify minified VeCI SMS-count overlay Terser asset hashes and rollback
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_storage_ui_built_v11.py' -v
      - name: Verify USB LTE-independent reversible UI-only SMS storage metadata overlay
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_storage_ui_hotfix.py' -v
      - name: Verify explicit-ack inbox index CLI rejects malformed PDU and masks sensitive SMS
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_inbox_cli_preview.py' -v
      - name: Verify no-write 3GPP AT+CMGL test never lists SMS on the modem
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_list_command_preflight.py' -v
      - name: Verify W907 physical SMS read-only mode/charset preflight parser
        run: python3 -m unittest discover -s tests -p 'test_veci_message_readiness.py' -v
      - name: Verify XL USSD *808# opt-in and per-menu generation-bound consent guard
        run: python3 -m unittest discover -s tests -p 'test_veci_xl_ussd_consent.py' -v
      - name: Verify bounded async USSD UCS2/unsupported DCS parser (offline)
        run: python3 -m unittest discover -s tests -p 'test_veci_ussd_decode.py' -v
      - name: Verify bounded multipart reconstruction and native SMS-PDU integration (offline)
        run: python3 -m unittest discover -s tests -p 'test_veci_sms_multipart.py' -v
      - name: Fuzz 10,000 malformed SMS/USSD payloads under ASAN and UBSAN
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/fuzz_veci_sms_codec.c \
            source/we5927-lte/src/veci-sms-pdu-decode.c \
            source/we5927-lte/src/veci-ussd-decode.c \
            -o "$RUNNER_TEMP/fuzz-veci-sms-codec"
          ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/fuzz-veci-sms-codec"
      - name: Fuzz 8,000 malformed and 1,000 complete multipart groups under ASAN UBSAN
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I source/we5927-lte/src \
            tests/fuzz_veci_sms_multipart.c source/we5927-lte/src/veci-sms-multipart.c \
            -o "$RUNNER_TEMP/fuzz-veci-multipart"
          ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/fuzz-veci-multipart"
      - name: Fuzz 5,000 fragmented AT mock sessions with ASAN and UBSAN
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I source/we5927-lte/src \
            tests/fuzz_veci_modem_transaction.c \
            source/we5927-lte/src/veci-modem-transaction.c \
            source/we5927-lte/src/veci-modem-job-queue.c \
            source/we5927-lte/src/veci-at-framing.c \
            -o "$RUNNER_TEMP/fuzz-veci-modem-transaction"
          ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/fuzz-veci-modem-transaction"
      - name: Assert no inactive SMS/USSD C libraries are linked into router
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          mk=Path('source/we5927-lte/Makefile').read_text()
          assert '$(CP) ./src/we5927-at.c $(PKG_BUILD_DIR)/' in mk
          for s in ('veci-at-framing.c','veci-modem-job-queue.c','veci-modem-session-lock.c',
                    'veci-sms-pdu-decode.c','veci-sms-multipart.c','veci-ussd-decode.c',
                    'veci-modem-transaction.c','veci-serial-pty-smoke.c',
                    'veci-modem-identity.c'):
              assert s not in mk, f'Unauthorized modem library in firmware build: {s}'
          print('INERT_BUILD_GUARD_PASS: optional native SMS/USSD sources not linked into firmware')
          PY
      - name: Validate existing LTE manager parses before AT integration
        run: sh -n source/we5927-lte/files/usr/sbin/we5927-lte
      - name: Verify both build editions stage the audited LTE manager
        shell: bash
        run: |
          set -euo pipefail
          for edition in general indonesia; do
            stage="$RUNNER_TEMP/sms-ussd-$edition"
            mkdir -p "$stage/package"
            VECI_EDITION="$edition" ./scripts/prepare-veci.sh "$stage"
            cmp source/we5927-lte/files/usr/sbin/we5927-lte "$stage/package/we5927-lte/files/usr/sbin/we5927-lte"
            cmp source/veci-cellular-we5927/files/usr/libexec/veci-modem-capabilities "$stage/package/veci-cellular-we5927/files/usr/libexec/veci-modem-capabilities"
            grep -q '"edition": "'$edition'"' "$stage/package/veci-default-ui/files/etc/veci-release.json"
            echo "SMS-USSD staged safely: $edition"
          done
      - name: Fail closed on any active modem command in probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source/veci-cellular-we5927/files/usr/libexec/veci-modem-capabilities').read_text()
          allowed=('AT+CMGF=?','AT+CPMS=?','AT+CNMI=?','AT+CUSD=?')
          assert all(s.count(x)==1 for x in allowed)
          assert "flock -n -x 9" in s
          assert "we5927-at.lock" in s
          assert not any(x in s for x in ('AT+CMGS=', 'AT+CMGL=', 'AT+CMGR=', 'AT+CMGD=', 'AT+CUSD=1,'))
          print('Only 4 AT capability tests, no SMS/USSD transaction, no router touched')
          PY
